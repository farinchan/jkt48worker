services:
  recorder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worker-stream-recorder
    restart: unless-stopped
    stop_grace_period: 35s
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=Asia/Jakarta
      - FFMPEG_PATH=ffmpeg
      - FFPROBE_PATH=ffprobe
      - RECORDINGS_DIR=/app/recordings
      - DATA_DIR=/app/data
      - LOG_DIR=/app/logs
      - CREDENTIALS_DIR=/app/credentials
    volumes:
      - ./recordings:/app/recordings
      - ./data:/app/data
      - ./logs:/app/logs
      - ./credentials:/app/credentials
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
