services:
  recorder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worker-stream-recorder
    restart: unless-stopped
    stop_grace_period: 35s
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-60021}:60021"
    environment:
      - NODE_ENV=production
      - TZ=Asia/Jakarta
      - FFMPEG_PATH=ffmpeg
      - FFPROBE_PATH=ffprobe
      - RECORDINGS_DIR=/app/recordings
      - DATA_DIR=/app/data
      - LOG_DIR=/app/logs
      - CREDENTIALS_DIR=/app/credentials
      - WEB_ENABLED=${WEB_ENABLED:-true}
      - WEB_PORT=60021
      - WEB_PASSWORD=${WEB_PASSWORD:-admin}
      - TELEGRAM_BOT_ENABLED=${TELEGRAM_BOT_ENABLED:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./recordings:/app/recordings
      - ./data:/app/data
      - ./logs:/app/logs
      - ./credentials:/app/credentials
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
